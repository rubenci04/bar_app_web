{% extends "layout.html" %}
{% block content %}
<div class="max-w-lg mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 dark:text-slate-100 mb-6">{{ action }} Usuario</h1>
    <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-lg border border-gray-200 dark:border-gray-700">
        <form method="POST" action="{{ url_for(request.endpoint, user_id=user.id) if user else url_for(request.endpoint) }}" class="space-y-6">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label for="username" class="block text-sm font-medium text-gray-600 dark:text-slate-300">Nombre de Usuario</label>
                <input type="text" name="username" id="username" value="{{ user.username if user else '' }}" required 
                       class="mt-1 block w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-blue-500 transition
                              disabled:bg-gray-200 dark:disabled:bg-gray-700/50 disabled:cursor-not-allowed" 
                       {% if user %}readonly disabled{% endif %}>
                 {% if user %}<p class="text-xs text-gray-400 dark:text-slate-500 mt-1">El nombre de usuario no se puede cambiar.</p>{% endif %}
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-600 dark:text-slate-300">Contraseña</label>
                <input type="password" name="password" id="password" 
                       class="mt-1 block w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-blue-500 transition" 
                       {% if not user %}required{% endif %} 
                       placeholder="{{ 'Dejar en blanco para no cambiar' if user else 'Nueva contraseña' }}">
            </div>
             <div>
                <label for="role" class="block text-sm font-medium text-gray-600 dark:text-slate-300">Rol</label>
                <select name="role" id="role" required class="mt-1 block w-full px-3 py-2 bg-gray-50 dark:bg-gray-700 border-gray-300 dark:border-gray-600 rounded-md focus:ring-2 focus:ring-blue-500 transition">
                    <option value="mozo" {% if user and user.role == 'mozo' %}selected{% endif %}>Mozo</option>
                    <option value="admin" {% if user and user.role == 'admin' %}selected{% endif %}>Admin</option>
                </select>
            </div>
            <div class="flex justify-end space-x-4 pt-4">
                <a href="{{ url_for('admin.manage_users') }}" class="px-4 py-2 rounded-lg font-semibold bg-gray-200 dark:bg-gray-600 hover:bg-gray-300 dark:hover:bg-gray-500 text-gray-800 dark:text-white transition-colors">Cancelar</a>
                <button type="submit" class="px-4 py-2 rounded-lg font-semibold bg-blue-600 hover:bg-blue-700 text-white transition-colors">{{ action }} Usuario</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
